name: marketplace identity probe

# Temporary, manual-only. The Marketplace authorises a publisher by the identity's Visual
# Studio profile id, which is not the Entra ID app's client id or object id and is not visible
# in the Azure portal — the only way to find it is to sign in as the identity and ask the
# profile API. This workflow does that and prints the `id` field; once the owner has copied it
# into the selvage-protocol publisher's Members, delete this file.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: marketplace
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 0538596d-b7e5-4f25-979f-49c437e48820
          tenant-id: eca3c161-254f-49bc-b981-b638ee9d0fa6
          allow-no-subscriptions: true

      # 499b84ac-1321-427f-aa17-267ca6975798 is the well-known Azure DevOps resource id,
      # identical for every tenant and safe to hardcode.
      # Only the id is printed: the full response also carries the identity's display name and
      # email address, which the workflow log for this public repository should not hold.
      - name: print the identity's Visual Studio profile id
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv
