name: e2e-current

# Candidate PRs run the real-server suites, peer corpus and two-window proof at the declared
# editor floor. The weekly and manual runs also catch upstream VS Code changes by using stable.
# Automated convergence is not human acceptance or a browser recording.
# The proof's helpers require sibling reference_server and specification checkouts.
on:
  pull_request:
  schedule:
    # Mondays 05:23 UTC: off the hour, so this run does not queue behind the many crons that fire
    # on it. The editor it resolves is `stable`, asked of the update service at run time.
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e-current-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-current:
    # GitHub-hosted `ubuntu-24.04`, like every other job in this repository. A cold Nix store
    # (the server's dev shell and a `cargo build`), a VS Code download and two Electron windows
    # make this the longest job here, which is why the timeout is not `ci.yml`'s.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The candidate itself, not the PR merge ref; main on the schedule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The sibling the proof's own paths expect, so the runner has the layout the local command
      # uses and no environment variable has to move it. The repository is public, so the
      # default token — `contents: read` on this repository alone — is only for rate limits.
      #
      # `actions/checkout` refuses a `path` outside `GITHUB_WORKSPACE` — `input-helper.ts`
      # resolves the input against the workspace and refuses anything not under it — so the
      # checkout lands inside the workspace and the step below moves it one level up. What reads
      # it is `../reference_server`: `test/helpers/selvaged.ts` and `test/e2e/run.ts` resolve
      # that from this repository's root, and `scripts/e2e/run-two-instance.sh` enters the server
      # flake's dev shell from that checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/reference_server
          ref: main
          path: .reference_server
          persist-credentials: false

      - name: move the server checkout to the sibling the proof reads
        run: mv .reference_server ../reference_server

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/specification
          ref: main
          path: .specification
          persist-credentials: false

      - name: move the corpus to the sibling its helpers read
        run: mv .specification ../specification

      # Siblings follow main; these SHAs are the reproducible cohort, not a compatibility claim
      # about an unrecorded future main. The candidate always supplies the engine under test.
      - name: the revisions and editor under test
        id: cohort
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "client $(git rev-parse HEAD)"
          echo "server $(git -C ../reference_server rev-parse HEAD)"
          echo "specification $(git -C ../specification rev-parse HEAD)"
          if [ "$EVENT_NAME" = pull_request ]; then
            editor=$(node -p "require('./package.json').engines.vscode.replace(/^\\^/, '')")
          else
            editor=stable
          fi
          echo "editor=$editor" | tee -a "$GITHUB_OUTPUT"

      # Copied from `reference_server`'s `ci.yml`, where it is copied from that repository's own
      # `nightly.yml`: the preinstalled toolchains nothing here uses, each removal non-fatal and
      # gated on the free space the runner actually has. This job needs the most of any here —
      # a Nix store, a VS Code download and two Electron windows — so it wants the insurance
      # even more, and it pays for it only when the free space is genuinely short.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      # The Node `engines.node` names, the same version `ci.yml` pins.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          cache: npm

      - run: npm ci

      # The proof loads the built extension (`dist/extension.js`), so it is built before the run.
      # `test/e2e/run.ts` builds again at its own start, which keeps the two agreeing.
      - run: npm run build

      # `nix` twice over: `scripts/e2e/run-two-instance.sh` runs the proof inside the server
      # flake's dev shell under `xvfb-run`, and `test/e2e/run.ts` evaluates `<nixpkgs>` for the
      # shared libraries an Electron binary downloaded outside nix needs on NixOS — which this
      # runner is not, so there the proof keeps the host's own libraries and no `NIX_PATH` has to
      # be arranged for it.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # `test/helpers/selvaged.ts` looks for the binary in the sibling's target tree and fails the
      # proof with this command when it is missing, so it is built the way the helper names. The
      # shell is entered with the server as the working directory, so its `shellHook` installs its
      # hooks there and not in this client checkout.
      - name: build the server the proof starts
        working-directory: ../reference_server
        run: nix develop . -c cargo build -p selvaged

      # The interop suite drives `reference_server`'s `interop_peer` example as a guest, and
      # `test/helpers/interop_peer.ts` looks for it in the sibling's target tree and fails the
      # suite with this command when it is missing.
      - name: build the interop peer the interop suite drives
        working-directory: ../reference_server
        run: nix develop . -c cargo build -p selvage-harness --example interop_peer

      # The four suites that need a built `selvaged` — the same four `npm test` runs — in one
      # command: `test:relay-selvaged`, `test:selvage2` (two files) and `test:interop`. Both
      # binaries above are already built, and `SELVAGE_WAIT_MS` is the deadline `ci.yml` gives its
      # suite.
      - name: the four real-server suites
        env:
          SELVAGE_WAIT_MS: "30000"
        run: npm run test:server

      - name: the specification's peer corpus and mutation census
        env:
          SELVAGE_SPECIFICATION: ${{ github.workspace }}/../specification
        run: npm run test:peer-corpus

      # The same local command: only the editor version differs by trigger.
      - name: the two-window proof against the selected editor
        env:
          SELVAGE_E2E_VSCODE_VERSION: ${{ steps.cohort.outputs.editor }}
        run: scripts/e2e/run-two-instance.sh

      # A red run here is this job doing its work, and the reason for one is in the editors' own
      # logs: `@vscode/test-electron` reports a child's exit code and nothing it printed, and a
      # build whose `code` binary never starts never reaches the extension host, so the proof's own
      # failure carries no cause. Printed only when something above failed, and it can turn nothing
      # red into green. The suites above leave no `.log` here, so a run with none prints nothing
      # rather than failing on the pattern.
      - name: the editors' own output, when the proof fails
        if: failure()
        run: |
          for log in .tmp/e2e-run/*.log; do
            [ -e "${log}" ] || continue
            echo "===== ${log}"
            tail -n 80 "${log}"
          done
