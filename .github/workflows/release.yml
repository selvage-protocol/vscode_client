name: release

# A release packages the extension (`vsce package`), attaches the `.vsix` to a GitHub
# Release, and publishes that one `.vsix` to the VS Code Marketplace and to Open VSX as
# `selvage-protocol.selvage`.
# The Marketplace half has no `VSCE_PAT`: it uses `vsce publish --azure-credential`,
# authenticating as a Microsoft Entra ID app registration federated to this repository's
# `marketplace` environment (see the publish job below). Trusted publishing (`--oidc`) is not
# available for this Marketplace publisher, so the workflow does not use it.
#
# Open VSX is not Microsoft and cannot read that Entra ID identity, so its step
# authenticates with the repository secret `OVSX_TOKEN` instead, through Eclipse's `ovsx`
# CLI. The two publishes are separate steps on purpose: a refusal names the registry that
# gave it, and either can fail while the other has already published.
#
# The owner triggers a release from this workflow. `workflow_dispatch` (with a required
# `bump` input naming `patch`, `minor` or `major`) is the manual button; pushing a tag `v*`
# releases the version that tag names. A dispatch computes its own version: it refuses
# unless the version `package.json` already carries is released as `v<version>` on the
# remote, derives the next one with `scripts/bump-version.sh`, commits it to `main` and
# releases that commit. Requiring the manifest version to be released is what makes a second
# click safe: a bump that has been pushed without its tag refuses loudly instead of
# computing the version after it and releasing a number nobody chose.
# A tag that already exists is accepted only when it names the commit this run releases —
# nothing here moves a tag — and an existing release has its `.vsix` asset refreshed rather
# than a second release. A pull request runs ci.yml instead and can never publish or release.
# `bump` carries no default, and this file carries no version string at all: the version
# `package.json` holds is the release, and `scripts/bump-version.sh` is the one thing that
# moves every copy of it.
#
# `package.json:4` carries the version the run asserts against.
#
# Three jobs, not two: `bump` holds `contents: write` for the one push it makes to `main`,
# and it runs the gate `ci.yml` runs before that push, because a commit pushed with this
# workflow's own `GITHUB_TOKEN` starts no workflow run: a bump pull request would carry no
# checks at all. `id-token: write` is held only by `publish`, which installs nothing, so an
# install script that misbehaves in `bump` can push this repository's history but cannot mint
# the Marketplace credential — the one identity only this workflow can use. `npm ci`, the
# build, the test suite and the standalone install of `@vscode/vsce` also run in `build`,
# which holds neither permission; the `.vsix` and both installed publishers cross into
# `publish` as artifacts, and `publish` only runs the `vsce` and `ovsx` binaries it
# downloaded, never `npm install` or `npm ci`. `publish` also runs under the `marketplace`
# GitHub environment, so the credential exchanges (and any required reviewers the owner adds
# there) gate on every trigger shape, tag push and manual dispatch alike.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which component to bump: scripts/bump-version.sh moves the version package.json carries, and the release is cut at the result"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Refuse if the manifest version is not released, print the version this bump would cut, and stop: nothing is bumped, committed, tagged, released or published"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned rather than `@latest`: the Open VSX publisher is third-party code that a release
  # runs with the repository's `OVSX_TOKEN`, so the version is chosen and reviewed here rather
  # than resolved at release time. `ovsx` needs Node 20 or newer; the jobs below set 22.18.0.
  OVSX_VERSION: "1.2.0"

permissions:
  contents: read

jobs:
  # A dispatch computes its own version here: it refuses unless the version `package.json` carries
  # is already released, derives the next one, runs the gate `ci.yml` runs against the bumped tree,
  # and commits and pushes the result to `main`. The gate is before the push because a commit
  # pushed with this workflow's own `GITHUB_TOKEN` starts no workflow run, so the commit that
  # reaches `main` gets its checks here or nowhere.
  #
  # That push is why this job holds `contents: write`. `id-token: write` stays with `publish`, so
  # the `npm ci` below cannot reach the Marketplace federation.
  #
  # On a tag push there is nothing to compute — the tag names the version and `build` reads it from
  # there — so every step here is skipped and the job reports green having done nothing.
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: "22.18.0"
          cache: npm

      # The version the manifest carries has to be released before the next one is computed from
      # it. A run that pushed its bump and died before `publish` created the tag leaves exactly
      # that state, and a second click there must refuse: computing from an unreleased manifest
      # releases the version after a number nobody has released. The tag reads are anonymous, and
      # the token stays out of `.git/config` until the step that needs it.
      - name: refuse unless the manifest version is released
        if: github.event_name == 'workflow_dispatch'
        run: |
          current=$(node -p "require('./package.json').version")
          remote=$(git ls-remote --tags origin "refs/tags/v${current}")
          if [ -z "$remote" ]; then
            cat >&2 <<EOF
          refusing: package.json carries ${current}, and there is no tag v${current} on the remote.
          That version was bumped but never released, and computing the next version from it would
          release the version after a number nobody has released. Push the tag at the commit that
          carries it (git push origin v${current}) and let this workflow release it, or put the
          manifest back to the version last released, then dispatch again.
          EOF
            exit 1
          fi
          echo "package.json ${current} is released as tag v${current}"

      # `scripts/bump-version.sh --dry-run` names the files it would write and prints the version it
      # would write as the last line of stdout — the one line this run takes its tag, its Release
      # and its commit subject from. The word is the dispatch input, applied to whatever the
      # manifest carries now.
      - name: derive the version this bump cuts
        if: github.event_name == 'workflow_dispatch'
        id: target
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          report=$(scripts/bump-version.sh "$BUMP" --dry-run)
          printf '%s\n' "$report"
          target=$(printf '%s\n' "$report" | tail -n1)
          remote=$(git ls-remote --tags origin "refs/tags/v${target}")
          if [ -n "$remote" ]; then
            cat >&2 <<EOF
          refusing: tag v${target} already exists on the remote, so this bump would cut a version
          that is already released. The manifest is behind its own tags: bump from the version the
          last release carries, then dispatch again.
          EOF
            exit 1
          fi
          echo "version=${target}" >> "$GITHUB_OUTPUT"

      - name: stop before changing anything on a dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          BUMP: ${{ inputs.bump }}
          TARGET: ${{ steps.target.outputs.version }}
        run: |
          cat <<EOF
          dry_run: nothing was bumped, gated, committed, pushed, tagged, released or published.
          This dispatch would have:
            - run scripts/bump-version.sh ${BUMP}, setting every version in the tree to ${TARGET}
            - run the gate ci.yml runs: npm ci, npm run typecheck, npm run build, npm run test:fast
            - committed that as DontBlameMe <dontblameme@noreply.codeberg.org> with the subject
              "chore(bump): release ${TARGET}", and pushed it to main
            - tagged v${TARGET}, created its GitHub Release, and published the .vsix to the VS Code
              Marketplace and to Open VSX
          EOF

      - name: bump the version
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          BUMP: ${{ inputs.bump }}
        run: scripts/bump-version.sh "$BUMP"

      # The gate `.github/workflows/ci.yml` runs, which `scripts/ci-local.sh client` mirrors, and it
      # runs on the bumped tree before the commit exists: a commit pushed with this workflow's own
      # `GITHUB_TOKEN` starts no run, so this is the only check that commit will ever have.
      - name: the gate CI runs
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          SELVAGE_WAIT_MS: "30000"
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run test:fast

      # The one push this workflow makes to `main`, and the reason this job holds `contents: write`.
      # A bump pull request would carry no checks at all — an event created with this workflow's own
      # `GITHUB_TOKEN` starts no run — so the gate above runs here instead. The commit's identity is
      # the one every other commit in this repository has.
      - name: commit and push the bump
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.version }}
        run: |
          git config user.name "DontBlameMe"
          git config user.email "dontblameme@noreply.codeberg.org"
          git commit -a -m "chore(bump): release ${TARGET}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix: ${{ steps.package.outputs.vsix }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A dispatch packages the commit `bump` pushed to `main`, which is not the commit the
          # dispatch named; a tag push packages the tagged commit, and on that path `bump` leaves
          # its output empty so this falls back to the event's own ref.
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      # The release version comes from `bump` on a dispatch and from the tag name on a tag push,
      # and with it the commit this run releases: the bump commit on a dispatch, the tagged commit
      # otherwise. Both pass through `env` rather than a workflow expression inside `run:`, and
      # anything that is not exactly X.Y.Z (all-digit components, no suffix) stops the job before
      # anything is asserted, tagged or released.
      - name: resolve the release version
        id: version
        env:
          BUMPED_VERSION: ${{ needs.bump.outputs.version }}
          BUMPED_SHA: ${{ needs.bump.outputs.sha }}
        run: |
          if [ -n "$BUMPED_VERSION" ]; then
            version="$BUMPED_VERSION"
            commit="$BUMPED_SHA"
          else
            version="${GITHUB_REF_NAME#v}"
            commit="${GITHUB_SHA}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'refusing: %s is not a release version\n' "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The manifest version is the release version: refuse to tag or package anything else. On a
      # dispatch the tree here is the commit `bump` pushed, so this also holds that job's version
      # output to the manifest it just wrote.
      - name: assert the manifest version matches
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "${{ steps.version.outputs.version }}" ]; then
            printf 'package.json version %s != release %s; bump package.json first\n' "$pkg" "${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - run: npm run typecheck

      # Same suite ci.yml runs: the four suites that need a built `selvaged` —
      # `test/relay-selvaged.test.ts`, `test/selvage2-selvaged.test.ts`,
      # `test/selvage2-reconnect-selvaged.test.ts` and `test/interop-v2.test.ts` — are not in
      # `test:fast`, and this workflow does not check out the sibling `reference_server`.
      - run: npm run test:fast
        env:
          SELVAGE_WAIT_MS: "30000"

      # `vsce package` runs `vscode:prepublish` (`npm run build`) first, so the `.vsix`
      # always carries a fresh `dist/extension.js`.
      - name: package the extension
        id: package
        run: |
          npm run package
          vsix="selvage-${{ steps.version.outputs.version }}.vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

      # The commit this `.vsix` was packaged from, read from the checkout that built it rather
      # than from `$GITHUB_SHA`, so `publish` can compare the two. The pair is what makes "the
      # tag and the package name the same commit" a check instead of an argument: the checkout
      # above carries the `ref` a dispatch needs, and a `ref` naming a different commit is caught
      # there rather than publish silently.
      - name: record the commit the package was built from
        run: git rev-parse HEAD > packaged-commit.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-commit
          path: packaged-commit.txt
          if-no-files-found: error

      # Installed here, in the job that already runs `npm ci` and holds no write
      # permission, rather than in `publish`: `@vscode/vsce` is third-party code with its own
      # install scripts, and `publish` should run only the resulting binary, never `npm
      # install`. Pinned to the exact version `package-lock.json` resolved, into a throwaway
      # prefix rather than the project's own `node_modules`, so the artifact carries only the
      # packager and not the whole extension dependency tree.
      - name: install the extension publisher
        run: |
          vsce_version=$(node -p "require('./package-lock.json').packages['node_modules/@vscode/vsce'].version")
          npm install --prefix vsce-publish --no-save --no-audit --no-fund "@vscode/vsce@${vsce_version}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsce-publish
          path: vsce-publish
          if-no-files-found: error

      # The same shape, for the same reason: `ovsx` is third-party code with its own install
      # scripts. Its version is pinned at the top of this file rather than resolved from a
      # registry at release time, and the prefix is throwaway, so the artifact carries the
      # publisher alone. `ovsx` depends on its own `@vscode/vsce` (3.x, which the 4.x above
      # does not satisfy), so that copy is nested inside this prefix and never shadows it.
      - name: install the Open VSX publisher
        run: |
          npm install --prefix ovsx-publish --no-save --no-audit --no-fund "ovsx@${OVSX_VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ovsx-publish
          path: ovsx-publish
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The `marketplace` environment scopes the Microsoft Entra ID federated credential's
    # subject. The organisation has ID-based (immutable) OIDC subject claims enabled, so GitHub
    # embeds the numeric org and repository ids:
    # `repo:selvage-protocol@328844633/vscode_client@1368869486:environment:marketplace`. That
    # is the exact string the federated credential is registered against, so azure/login
    # below succeeds only when this job names it — on a tag push and a manual dispatch alike,
    # since GitHub keys the OIDC subject to the environment name rather than the triggering
    # ref once a job declares one. It also gives the owner a place to add required reviewers.
    environment: marketplace
    # `contents: write` creates and pushes the tag and the GitHub Release. `id-token: write`
    # is the OIDC token azure/login exchanges for a Marketplace publishing credential.
    # Nothing else is granted, and nothing in this job installs the project's own dependency
    # tree.
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      VSIX: ${{ needs.build.outputs.vsix }}
    steps:
      # Not persisted: this job's git commands authenticate with an explicit token scoped to
      # the one step that pushes, rather than a credential left in `.git/config` for every
      # step in the job to find. The commit to tag is the one `build` packaged from, which is the
      # commit `bump` pushed on a dispatch and the tagged commit on a tag push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsce-publish
          path: vsce-publish

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ovsx-publish
          path: ovsx-publish

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-commit

      # Node to run the `vsce` entry point downloaded above; nothing is installed with it.
      # Moved ahead of tagging and the Marketplace login so the check below can use it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # `actions/upload-artifact` excludes hidden files by default, and npm's `.bin`
      # shims are themselves inside a hidden directory, so `node_modules/.bin/vsce` never
      # survives the artifact round-trip even when the install prefix that holds it is not
      # itself dotted. `vsce`'s own package.json points `bin` at `node_modules/@vscode/vsce/vsce`,
      # an ordinary file one level up, so every step below runs that path through `node`
      # directly and never touches `.bin`. Checking it here, before the tag, the Release or
      # the Marketplace login exist, turns a missing publisher into a clear failure instead
      # of "No such file or directory" three steps into the privileged half of this job.
      - name: verify the extension publisher is present
        run: node ./vsce-publish/node_modules/@vscode/vsce/vsce --version

      # One entry point for the second registry too, checked here for the same reason: a
      # missing publisher should stop the run before the tag exists, not three steps later.
      - name: verify the Open VSX publisher is present
        run: node ./ovsx-publish/node_modules/ovsx/bin/ovsx --version

      # The `.vsix` this job is about to hand to two registries came from `build` in this run, and
      # the tag is about to be created at `RELEASE_COMMIT`. Both facts are asserted rather than
      # assumed: the commit `build` packaged from is read out of its artifact and compared with this
      # job's checkout and with the commit this run releases. A mismatch stops the job before the
      # tag is touched and before anything is published, so a package built from a different commit
      # than the tag names is a red run and not a silent release. `RELEASE_COMMIT` stands where the
      # run's own sha used to: a dispatch releases the commit its bump produced, and that is not the
      # commit the dispatch named.
      - name: verify the package came from the commit this run releases
        run: |
          packaged=$(cat packaged-commit.txt)
          checked_out=$(git rev-parse HEAD)
          if [ "$packaged" != "$checked_out" ] || [ "$checked_out" != "$RELEASE_COMMIT" ]; then
            printf 'refusing: the .vsix was packaged from %s, this job checked out %s, this run releases %s\n' \
              "$packaged" "$checked_out" "$RELEASE_COMMIT" >&2
            exit 1
          fi
          echo "the .vsix was packaged from ${packaged}, which is the commit this run releases"

      # Tags are resolved against `origin`, not local refs: the checkout may not have fetched
      # them. An existing tag must name the commit this run releases; anything else is someone
      # else's release and stops the job. A version whose tag already exists at that commit is the
      # shape a tag push arrives in, and is accepted. No branch here moves a tag: a dispatch derives
      # its version from the manifest, so the version after a released one is a new number, and
      # there is no re-run at a named version left for a move to serve. An annotated tag's own ref
      # resolves to the tag object, not the commit it names, so both the plain ref and its peeled
      # `^{}` form are queried and the peeled (commit) sha is preferred when present. A push that is
      # rejected because another run created the same tag a moment earlier is not itself a failure:
      # the tag is re-queried and accepted if it now names the commit this run releases, and only
      # anything else fails the job.
      - name: create and push the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          remote_refs=$(git ls-remote origin "refs/tags/v${RELEASE_VERSION}" "refs/tags/v${RELEASE_VERSION}^{}" 2>/dev/null)
          if [ -z "$remote_refs" ]; then
            git tag -a "v${RELEASE_VERSION}" -m "v${RELEASE_VERSION}"
            if ! git push origin "v${RELEASE_VERSION}"; then
              echo "push of v${RELEASE_VERSION} was rejected; another run may have created it first"
              remote_refs=$(git ls-remote origin "refs/tags/v${RELEASE_VERSION}" "refs/tags/v${RELEASE_VERSION}^{}" 2>/dev/null)
            fi
          fi
          if [ -n "$remote_refs" ]; then
            remote_sha=$(printf '%s\n' "$remote_refs" | tail -n1 | cut -f1)
            echo "tag v${RELEASE_VERSION} already exists at ${remote_sha}"
            if [ "$remote_sha" != "$RELEASE_COMMIT" ]; then
              printf 'refusing: tag v%s points at %s, not the commit this run releases\n' "$RELEASE_VERSION" "$remote_sha" >&2
              exit 1
            fi
          fi

      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          # Selvage for VS Code v${RELEASE_VERSION}

          Install the attached \`${VSIX}\` (\`code --install-extension ${VSIX}\`), or once this
          version has published, \`code --install-extension selvage-protocol.selvage\` from the
          [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=selvage-protocol.selvage)
          or [Open VSX](https://open-vsx.org/extension/selvage-protocol/selvage).
          EOF
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "release v${RELEASE_VERSION} already exists; refreshing the vsix asset."
            gh release upload "v${RELEASE_VERSION}" "$VSIX" --clobber
          else
            gh release create "v${RELEASE_VERSION}" --title "v${RELEASE_VERSION}" --notes-file release-notes.md "$VSIX"
          fi

      # Federated identity, not a stored secret: this exchanges the job's OIDC token (minted
      # because `publish` runs under the `marketplace` environment and holds `id-token:
      # write`) for a short-lived Microsoft Entra ID credential. The app registration has no
      # role assignment on any Azure subscription — it exists only to authenticate to the
      # Marketplace — so `allow-no-subscriptions` skips the subscription lookup `azure/login`
      # otherwise requires. Client ID and tenant ID are public identifiers, not secrets;
      # hardcoded here rather than as repository variables because nothing in this session's
      # tooling can create Actions variables, and a workflow file is itself reviewable
      # provenance for which identity a release runs as.
      # The Marketplace authorises this identity by its Visual Studio profile id, which is a
      # separate value from the client id below and is not shown anywhere in the Azure portal;
      # if this identity is ever rotated, the replacement's profile id is found by signing in as
      # it and querying `az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me
      # --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv` before adding
      # it to the publisher's Members.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 0538596d-b7e5-4f25-979f-49c437e48820
          tenant-id: eca3c161-254f-49bc-b981-b638ee9d0fa6
          allow-no-subscriptions: true

      # `--azure-credential` authenticates as the Microsoft Entra ID identity `azure/login`
      # just signed in as; trusted publishing (`--oidc`) is not available for this Marketplace
      # publisher (checked on the publisher's own management page: no trusted-publishing
      # policy form exists there), so this is the working route rather than a fallback. It
      # does not swallow a failure: a non-zero exit here fails the job, and the tag and GitHub
      # Release above already exist independently of whether this step succeeds.
      - name: publish to the VS Code Marketplace
        run: |
          if ! node ./vsce-publish/node_modules/@vscode/vsce/vsce publish --azure-credential --packagePath "$VSIX"; then
            cat >&2 <<EOF
          Marketplace publish failed. If this is a new identity, confirm its Visual Studio
          profile id has been added to the selvage-protocol publisher's Members with a
          publishing role (Creator or above). The tag and GitHub Release above already exist
          regardless of this step's outcome, and Open VSX is published by the step below, which
          has not run yet.
          EOF
            exit 1
          fi

      # The same `.vsix`, the same commit, and the same release: one step further down so that a
      # refusal names the registry it came from. The Marketplace step above has already run by
      # the time this one starts, so a failure here leaves one registry published and the other
      # not — which the message says rather than leaving it to be worked out from the log.
      #
      # The token is the repository secret `OVSX_TOKEN`, handed to `ovsx` under the name it reads
      # (`OVSX_PAT`) and never as a `--pat` argument, so it stays out of the process list. The
      # emptiness check is not decoration: with no token and `id-token: write` held by this job,
      # `ovsx` falls through to Open VSX's own trusted publishing and fails with an error about a
      # missing registration, which reads as a broken publisher rather than a missing secret.
      - name: publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            printf 'refusing: no OVSX_TOKEN secret is set for this repository\n' >&2
            exit 1
          fi
          if ! node ./ovsx-publish/node_modules/ovsx/bin/ovsx publish --packagePath "$VSIX"; then
            cat >&2 <<EOF
          Open VSX publish failed. The Marketplace publish above may already have succeeded, and
          the tag and GitHub Release exist regardless. A namespace the token cannot publish to,
          or a version already on open-vsx.org, both land here.
          EOF
            exit 1
          fi
