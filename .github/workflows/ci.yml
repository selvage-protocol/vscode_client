name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The four server-backed tests in `test/selvaged.test.ts` need a built `selvaged` from the
      # sibling `reference_server` repository, which this workflow does not check out, so CI runs
      # the server-free suite. Run `npm test` locally, with a server built, for the real thing.
      - run: npm run test:fast

  # Actions results are not readable where the maintainer works; an issue is the only signal.
  # A pull request files nothing: its check runs are readable on the pull request itself.
  report:
    needs: [checks]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "ci: ${{ github.workflow }} is failing on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failing run: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Failing run: $RUN"
          fi

  clear:
    needs: [checks]
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "ci: ${{ github.workflow }} is failing on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Green again: $RUN"
          fi
