name: ci

# No `push: branches: [main]`: a pull request already runs the whole job, and the
# merge commit carries the same content, so the merge would run it a second time.
# `workflow_dispatch` is the re-run for a commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The four suites that need a built `selvaged` from the sibling `reference_server`
      # repository — `test/relay-selvaged.test.ts`, `test/selvage2-selvaged.test.ts`,
      # `test/selvage2-reconnect-selvaged.test.ts` and `test/interop-v2.test.ts` — which this
      # workflow does not check out, so CI runs the server-free suite. Run `npm test` locally for
      # the real thing, with a server built and an `interop_peer` beside it for the interop suite
      # (`cargo build -p selvage-harness --example interop_peer`, or `SELVAGE_INTEROP_PEER` at
      # one).
      # A shared runner is slower than a developer's machine; the suite's waits poll conditions
      # that do hold, and this only makes the deadline generous enough not to race the load.
      - run: npm run test:fast
        env:
          SELVAGE_WAIT_MS: "30000"
