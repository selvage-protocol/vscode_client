name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The four server-backed tests in `test/selvaged.test.ts` need a built `selvaged` from the
      # sibling `reference_server` repository, which this workflow does not check out, so CI runs
      # the server-free suite. Run `npm test` locally, with a server built, for the real thing.
      - run: npm run test:fast
