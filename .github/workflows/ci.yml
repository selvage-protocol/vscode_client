name: ci

# No `push: branches: [main]`: a pull request already runs the whole job, and the
# merge commit carries the same content, so the merge would run it a second time.
# `workflow_dispatch` is the re-run for a commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.revisions.outputs.candidate }}
      specification: ${{ steps.revisions.outputs.specification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: vscode_client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/specification
          ref: 12795c817566897d0af4c13877d229f4555581f8
          path: specification
          persist-credentials: false
      - name: record the contract revisions
        id: revisions
        run: |
          candidate=$(git -C vscode_client rev-parse HEAD)
          specification=$(git -C specification rev-parse HEAD)
          echo "candidate=$candidate" | tee -a "$GITHUB_OUTPUT"
          echo "specification=$specification" | tee -a "$GITHUB_OUTPUT"
      - name: public workspace contracts against the candidate
        run: >-
          python3 specification/scripts/check-workspace.py --workspace .
          --consumer vscode_client --revision vscode_client=HEAD --revision specification=HEAD

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The release nixpkgs carries today, so a developer and the runner check with the same
      # binary. The checksum is the one published beside the archive.
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The guard around a workflow's `dry_run` input (`scripts/check_dry_run_gating.py`):
      # `release.yml` declares one, its plan step carries `inputs.dry_run == true` and every step
      # and job after it carries the same test negated, which is the whole of what keeps a
      # rehearsal from cutting a release. `actionlint` cannot see a condition that is *missing*
      # from a step, so nothing else reads that. This runs the guard's own suite and then the
      # guard over the workflows here; `scripts/ci-local.sh client` builds the same checks as
      # the flake check `dry-run-gating`, whose Python supplies the PyYAML pinned below.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"

      - name: install the guard's dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: the release workflow's dry_run gating
        run: |
          python3 -B scripts/test_check_dry_run_gating.py
          python3 -B scripts/check_dry_run_gating.py .github/workflows

      # The Node `engines.node` names: the extension host of the declared VS Code floor, so the
      # suite runs on the runtime the extension is installed into.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          cache: npm

      - name: the release workflow's retry preconditions
        run: python3 -B scripts/test_release_retry_guard.py

      - run: npm ci

      - run: npm run typecheck

      # The four suites that need a built `selvaged` from the sibling `reference_server`
      # repository — `test/relay-selvaged.test.ts`, `test/selvage2-selvaged.test.ts`,
      # `test/selvage2-reconnect-selvaged.test.ts` and `test/interop-v2.test.ts` — are not in this
      # job: it does not check out that repository. `e2e-current.yml` checks out the
      # server, builds `selvaged` and the `interop_peer` the interop suite drives, and runs all
      # four with `npm run test:server` beside the two-window proof on each candidate PR at the
      # declared editor floor, and weekly against stable. Run `npm test` locally for the
      # real thing, with a server built and an `interop_peer` beside it for the interop suite
      # (`cargo build -p selvage-harness --example interop_peer`, or `SELVAGE_INTEROP_PEER` at
      # one).
      # A shared runner is slower than a developer's machine; the suite's waits poll conditions
      # that do hold, and this only makes the deadline generous enough not to race the load.
      - run: npm run test:fast
        env:
          SELVAGE_WAIT_MS: "30000"

      # The runner has no nix, so the pinned release is installed here and `lychee` is taken from
      # PATH, which is what `scripts/ci-local.sh links` does locally with a nix shell.
      - name: install lychee
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 "$RUNNER_TEMP/lychee" /usr/local/bin/lychee
          lychee --version

      # `README.md` and `docs/` only: this repository's reader-facing front matter. `lychee.toml`
      # says what that leaves out and why, and `scripts/ci-local.sh links` runs the same command.
      - name: links
        run: lychee --config lychee.toml --no-progress README.md docs
